apply plugin: 'base'

configurations {
    jreleaserRuntime {
        canBeConsumed = false
    }
}

dependencies {
    jreleaserRuntime "org.jreleaser:jreleaser:${libs.versions.jreleaser.get()}"
}

def stagingDirectory = layout.projectDirectory.dir('build/staging-deploy')
def cleanStaging = tasks.register('cleanStagingRepository', Delete) {
    delete stagingDirectory
}

def stageArtifacts = tasks.register('stageArtifacts') {
    group = 'publishing'
    description = 'Stages the library Maven publications locally for JReleaser.'
    dependsOn cleanStaging
}

subprojects.findAll { it.name != 'jetcd-ctl' }.each { module ->
    module.plugins.withId('maven-publish') {
        module.publishing.repositories.maven {
            name = 'JReleaserStaging'
            url = stagingDirectory
        }

        module.tasks.withType(PublishToMavenRepository).configureEach {
            if (name.endsWith('ToJReleaserStagingRepository')) {
                mustRunAfter cleanStaging
            }
        }

        stageArtifacts.configure {
            dependsOn "${module.path}:publishAllPublicationsToJReleaserStagingRepository"
        }
    }
}

def jreleaserDeploy = tasks.register('jreleaserDeploy', JavaExec) {
    group = 'publishing'
    description = 'Deploys staged Maven artifacts with JReleaser.'
    dependsOn stageArtifacts

    // Run outside Gradle's plugin classpath because JReleaser and Axion use different JGit APIs.
    classpath = configurations.jreleaserRuntime
    mainClass = 'org.jreleaser.cli.Main'
    args 'deploy', '--basedir', projectDir, '--config-file', file('gradle/jreleaser.yml'),
        '--output-directory', layout.buildDirectory.get().asFile
    environment 'JRELEASER_PROJECT_VERSION', rootProject.version.toString()
    environment 'JRELEASER_PROJECT_JAVA_GROUP_ID', rootProject.group.toString()
}

tasks.register('publishSnapshot') {
    group = 'publishing'
    description = 'Publishes a SNAPSHOT version with JReleaser.'
    dependsOn jreleaserDeploy
}

tasks.register('publishRelease') {
    group = 'publishing'
    description = 'Publishes a release version with JReleaser.'
    dependsOn jreleaserDeploy
}

gradle.taskGraph.whenReady { graph ->
    def version = rootProject.version.toString()

    if (graph.hasTask(':publishSnapshot') && !version.endsWith('-SNAPSHOT')) {
        throw new GradleException("publishSnapshot requires a SNAPSHOT version, but Axion resolved ${version}")
    }
    if (graph.hasTask(':publishRelease') && version.endsWith('-SNAPSHOT')) {
        throw new GradleException("publishRelease requires a release version, but Axion resolved ${version}")
    }
}
