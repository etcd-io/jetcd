plugins {
    alias(libs.plugins.protobuf)
}

dependencies {
    api libs.slf4j
    api libs.vertxGrpcClient
    api platform(libs.protobufBom)
    api libs.protobufJava
    api libs.checkerQual

    runtimeOnly libs.protobufJavaUtil
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}"
    }
    plugins {
        vertx {
            artifact = "io.vertx:vertx-grpc-protoc-plugin2:${libs.versions.vertx.get()}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            vertx {
                option 'grpc-client=true'
            }
        }
    }
}
